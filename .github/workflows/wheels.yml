name: wheels

# Builds the sdist and the Linux wheels. Run by hand, or by publishing a
# GitHub release (which also uploads to PyPI through trusted publishing).
on:
  workflow_dispatch:
  release:
    types: [published]
  # Also whenever the packaging changes, so that a release does not find out.
  pull_request:
    paths: [pyproject.toml, setup.py, MANIFEST.in, src/ringloop/ll_abi.h, src/ringloop/ll_uring.h, .github/workflows/wheels.yml]

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # The sdist builds and runs where the kernel headers are older than the
  # io_uring features the engine uses (Ubuntu 22.04 has headers from 5.15).
  sdist-old-headers:
    needs: sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: python -m pip install dist/*.tar.gz && cd / && python $GITHUB_WORKSPACE/conformance/smoke.py

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    if: github.event_name == 'release'
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A release tagged v1.2.3 (or 1.2.3) must hold version 1.2.3.
      - name: The tag is the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test -f "dist/ringloop-${TAG#v}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@release/v1
